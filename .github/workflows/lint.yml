name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit==4.6.0
      - run: pre-commit run --all-files --show-diff-on-failure

  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            colvenna-operator/pom.xml
            colvenna-jobs/pom.xml
      - run: mvn -B -f colvenna-operator/pom.xml clean verify
      - run: mvn -B -f colvenna-jobs/pom.xml clean verify

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash colvenna-cli/check.sh

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash colvenna-console/check.sh

  bi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash colvenna-bi/check.sh

  # The AWS stacks, the install scripts and the Helm charts (the catalog's is its release's, #295).
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/aws/package-lock.json
      - run: npm ci
        working-directory: deploy/aws
      - run: npm run check
        working-directory: deploy/aws
      - run: npm test
        working-directory: deploy/aws
      - run: shellcheck -x deploy/*.sh deploy/scripts/*/*.sh
      # The pinned crane, which promote.sh's offline tests run against a stub registry (test_promote.py).
      - run: bash deploy/scripts/foundation/install-crane.sh
      # The release manifest's schema and the required cases' markers (deploy/scripts/release/manifest.py),
      # and the promotion of a GO candidate to a release (promotion.py, promote.sh).
      - run: python3 -m unittest discover -s deploy/scripts/release -p 'test_*.py'
      # The check that keeps deployment values out of the repository (#248), which pre-commit runs.
      - run: python3 -m unittest discover -s deploy/scripts/redaction -p 'test_*.py'
      # The check that the project's old name stays gone (#271), which pre-commit runs.
      - run: python3 -m unittest discover -s deploy/scripts/rename -p 'test_*.py'
      - run: helm lint deploy/helm/colvenna-monitoring --set images.prometheus=prometheus --set images.grafana=grafana
      # The alert rules as the chart renders them (promtool check and unit tests) and the panels.
      - run: bash deploy/scripts/monitoring/check-rules.sh
      - run: >-
          helm lint deploy/helm/colvenna-operator --set image.repository=repo --set image.digest=sha256:0
          --set catalog.caCert=ca --set jobs.checkpointRoot=s3://bucket/flink-state
          --set jobs.roleArns.colvenna-data=arn:aws:iam::111122223333:role/colvenna-lake-uat-jobs-colvenna-data
          --set 'managedNamespaces={colvenna-data}'
      - run: >-
          helm lint deploy/helm/colvenna-console --set image.repository=repo --set image.digest=sha256:0 --set region=us-west-2
          --set serviceAccount.roleArn=arn:aws:iam::111122223333:role/colvenna-lake-uat-console
          --set entry.publicUrl=https://console.example --set entry.signInUrl=https://signin.example
          --set entry.userPoolId=us-west-2_x --set entry.clientId=client
          --set entry.loadBalancerArn=arn --set entry.targetGroupArn=arn
          --set 'entry.subnetCidrs={10.84.0.0/24}' --set auditLogGroup=/colvenna-lake-uat/console-audit
          --set-json 'entry.roleGroups={"colvenna-admin":"admin"}' --set entry.sessionCookie=colvenna-console-auth
          --set 'pipeline.namespaces={colvenna-data}'
      - run: >-
          helm lint deploy/helm/colvenna-bi --set image.repository=repo --set image.digest=sha256:0 --set region=us-west-2
          --set serviceAccount.roleArn=arn:aws:iam::111122223333:role/colvenna-lake-uat-bi
          --set entry.publicUrl=https://bi.example --set entry.signInUrl=https://signin.example
          --set entry.userPoolId=us-west-2_x --set entry.clientId=client
          --set entry.loadBalancerArn=arn --set entry.targetGroupArn=arn --set entry.sessionCookie=colvenna-bi-auth
          --set 'entry.subnetCidrs={10.84.0.0/24}' --set-json 'entry.roleGroups={"colvenna-bi":"bi"}'
          --set doris.host=fe

  # The acceptance and performance tests' own code, the fixtures and the upstream checks; the tests
  # themselves run against an installed environment.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            tests/acceptance/catalog/flink/pom.xml
            tests/acceptance/catalog/spark/pom.xml
            tests/acceptance/catalog/migration/pom.xml
            tests/performance/tools/pom.xml
      - run: mvn -B -f tests/acceptance/catalog/flink/pom.xml clean verify
      - run: mvn -B -f tests/acceptance/catalog/spark/pom.xml clean verify
      - run: mvn -B -f tests/acceptance/catalog/migration/pom.xml clean verify
      - run: mvn -B -f tests/performance/tools/pom.xml clean verify
      - run: python3 -m unittest discover -s tests/acceptance -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/performance -p 'test_*.py'
      - run: shellcheck -x tests/acceptance/*.sh tests/acceptance/*/*.sh tests/fixtures/*/*.sh tests/upstream/*/*.sh tests/performance/*.sh
      - run: helm lint tests/fixtures/kafka/colvenna-dev-kafka
      - run: helm lint tests/fixtures/kafka/colvenna-dev-kafka --set storage.type=ephemeral

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash assets/architecture/check-go.sh
