apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Release.Name }}-node
  labels:
    {{- include "colvenna-dev-kafka.labels" . | nindent 4 }}
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    {{- if eq .Values.storage.type "ephemeral" }}
    type: ephemeral
    sizeLimit: {{ .Values.storage.size }}
    {{- else if eq .Values.storage.type "persistent-claim" }}
    type: persistent-claim
    size: {{ .Values.storage.size }}
    {{- with .Values.storage.class }}
    class: {{ . }}
    {{- end }}
    deleteClaim: {{ .Values.storage.deleteClaim }}
    {{- else }}
    {{- fail "storage.type must be persistent-claim or ephemeral" }}
    {{- end }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  jvmOptions:
    -Xms: {{ .Values.heap }}
    -Xmx: {{ .Values.heap }}
  template:
    pod:
      {{- include "colvenna-dev-kafka.affinity" . | nindent 6 }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "colvenna-dev-kafka.labels" . | nindent 4 }}
  {{- if .Values.recovery.clusterId }}
  annotations:
    # Held until the retained volume's cluster id is in the status (dev-kafka.sh install).
    strimzi.io/pause-reconciliation: "true"
  {{- end }}
spec:
  kafka:
    version: {{ .Values.kafkaVersion }}
    {{- with .Values.image }}
    image: {{ . }}
    {{- end }}
    listeners:
      # Inside the cluster only, TLS and SCRAM-SHA-512: no external listener, no anonymous client.
      - name: auth
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
        networkPolicyPeers:
          - namespaceSelector:
              matchLabels:
                {{ .Values.clientNamespaceLabel }}: "true"
    authorization:
      type: simple
    config:
      auto.create.topics.enable: false
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    topicOperator:
      {{- include "colvenna-dev-kafka.operatorResources" . | nindent 6 }}
    userOperator:
      {{- include "colvenna-dev-kafka.operatorResources" . | nindent 6 }}
    template:
      pod:
        {{- include "colvenna-dev-kafka.affinity" . | nindent 8 }}
