{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name }}
  labels:
    {{- include "colvenna-dev-kafka.labels" $ | nindent 4 }}
spec:
  partitions: {{ .partitions }}
  replicas: 1
  config:
    retention.ms: {{ .retentionMs | int64 }}
    {{- with .config }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
