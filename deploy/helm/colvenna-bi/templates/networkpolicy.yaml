# No pod connects to Superset: only the load balancer, from the public subnets it sits in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "colvenna-bi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "colvenna-bi.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range (required "entry.subnetCidrs" .Values.entry.subnetCidrs) }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8443
