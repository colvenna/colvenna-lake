# Only the target group binding uses the Service: the load balancer reaches the pod by IP.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "colvenna-bi.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "colvenna-bi.selector" . | nindent 4 }}
  ports: [{name: https, port: 8443, targetPort: https}]
