# The operator's rights: a lease for leader election in its namespace (and, reporting lineage, the
# ConfigMap of what it reported), and everything else only inside the managed namespaces
# (templates/managed-namespaces.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-leader
  labels:
    {{- include "colvenna-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-leader
  labels:
    {{- include "colvenna-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-leader
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.lineage.url }}
---
# What the lineage publisher reported, kept for the next leader (one key per managed namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-lineage
  labels:
    {{- include "colvenna-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ printf "%s-lineage" .Release.Name }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-lineage
  labels:
    {{- include "colvenna-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-lineage
  apiGroup: rbac.authorization.k8s.io
{{- end }}
