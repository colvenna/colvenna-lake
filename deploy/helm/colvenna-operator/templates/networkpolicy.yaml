# Nothing may connect to the operator except the metrics port, from monitoring namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "colvenna-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "colvenna-operator.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.metricsClientLabel }}: "true"
      ports:
        - protocol: TCP
          port: 9100
