apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "colvenna-console.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn" .Values.serviceAccount.roleArn | quote }}
# The console reads the pipeline's declarations with this identity (rbac.yaml: get and list).
automountServiceAccountToken: true
